# vmux configuration — see `vmux launch --help` for all options.

# Backend: "bwrap" (bubblewrap sandbox) or "microvm" (full NixOS VM).
backend = "bwrap"

[workspace]
host_path = "."                # host directory mounted into the sandbox
mount = "/workspace"           # mount point inside the sandbox

[tools]
agent = "claude"               # claude | aider | codex | pi-agent | <custom command>
editor = "avim"                # avim | nvim | hx | emacs | <custom command>

[layout]
type = "editor-agent"          # editor-agent | agent-only | editor-only | full

# ── Sandbox configuration (bwrap backend) ─────────────────────────────
[sandbox]
# Network isolation mode:
#   "none"   — no network at all (most secure)
#   "proxy"  — API access through domain-filtering proxy
#   "host"   — full host network (no isolation)
network = "proxy"

# Seccomp policy:
#   "none"    — no syscall filtering
#   "default" — block namespace escapes + raw sockets
#   "strict"  — also block ptrace, mount, bpf, etc.
seccomp = "default"

# Domains reachable via proxy (only when network = "proxy").
proxy_allow = [
    "api.anthropic.com",
    "api.openai.com",
    "github.com",
    "api.github.com",
]

# Paths hidden from the sandbox (relative to $HOME).
# These are always denied in addition to built-in defaults
# (~/.ssh, ~/.gnupg, ~/.aws, ~/.docker, ~/.kube, etc.).
# deny_paths = ["extra/sensitive/dir"]

# Set to false to disable built-in default deny paths
# (only your explicit deny_paths will apply).
# use_default_deny_paths = true

# ── Namespace isolation ───────────────────────────────────────────────
# Network namespace is controlled by the `network` field above.
# [sandbox.namespaces]
# pid    = true     # isolate PID namespace (--unshare-pid)
# ipc    = true     # isolate IPC namespace (--unshare-ipc)
# uts    = false    # isolate UTS/hostname namespace (--unshare-uts)
# user   = false    # isolate user namespace (--unshare-user)
# cgroup = false    # isolate cgroup namespace (--unshare-cgroup)

# ── Extra bind mounts ─────────────────────────────────────────────────
# Read-only bind mounts (host path → sandbox path).
# [[sandbox.ro_binds]]
# src = "/opt/tools"
# dst = "/opt/tools"

# Read-write bind mounts (host path → sandbox path).
# [[sandbox.rw_binds]]
# src = "/tmp/shared"
# dst = "/shared"

# ── Tmpfs mounts ──────────────────────────────────────────────────────
# Extra tmpfs mount points (in addition to default /tmp and /home).
# tmpfs = ["/run", "/var/tmp"]

# Set to false to disable default /tmp and /home tmpfs mounts.
# use_default_tmpfs = true

# ── Environment variables ─────────────────────────────────────────────
# Extra environment variables injected into the sandbox.
# [sandbox.env]
# EDITOR = "nvim"
# TERM = "xterm-256color"

# ── Secrets ────────────────────────────────────────────────────────────
# Injected as env vars into the sandbox.
# Supported sources: op://…, sops:…, env:…, file:…

# [[secrets]]
# name = "ANTHROPIC_API_KEY"
# source = "op://Private/anthropic/api-key"

# [[secrets]]
# name = "GITHUB_TOKEN"
# source = "env:GITHUB_TOKEN"

# ── MicroVM configuration (microvm backend only) ──────────────────────
# [vm]
# name = "dev"
# flake = "."
# ip = "192.168.83.10"
