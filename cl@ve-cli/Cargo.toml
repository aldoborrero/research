[package]
name = "clave-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Cl@ve AEAT authentication (Spain's digital identity system)"
license = "MIT"

[[bin]]
name = "clave"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = ["linux-native"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
urlencoding = "2"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
