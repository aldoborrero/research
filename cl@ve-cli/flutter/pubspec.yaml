name: clave
description: >
  Alternative Cl@ve AEAT client for Spain's digital identity authentication.
  Powered by a Rust core shared across CLI, web, and mobile.

publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.9.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  riverpod: ^2.6.0
  flutter_riverpod: ^2.6.0
  go_router: ^14.0.0
  google_fonts: ^6.2.0
  flutter_secure_storage: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  flutter_rust_bridge_codegen: 2.9.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
