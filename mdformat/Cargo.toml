[package]
name = "mdformat"
version = "0.1.0"
edition = "2021"
description = "A CommonMark-compliant, opinionated Markdown formatter"
license = "MIT"

[dependencies]
comrak = "0.36"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1"
